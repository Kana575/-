<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youth Opportunities Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <span class="logo-icon">🎯</span>
                <div>
                    <h1>Youth Opportunities Hub</h1>
                    <p>Гранты, вакансии и мероприятия для молодежи (16–35 лет)</p>
                </div>
            </div>
            <button id="update-btn" class="update-btn">⚡ Поиск обновлений</button>
        </div>
    </header>

    <main class="main-container">
        <div class="controls">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Поиск по название или описанию...">
            </div>
            <div class="filters">
                <button class="filter-chip active" data-category="all">Все</button>
                <button class="filter-chip" data-category="вакансия">💼 Вакансии</button>
                <button class="filter-chip" data-category="грант">🎓 Гранты</button>
                <button class="filter-chip" data-category="мероприятие">🟢 Мероприятия</button>
            </div>
        </div>

        <div id="cards-container" class="cards-grid">
            <!-- Карточки будут вставлены сюда через JS -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
