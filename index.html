<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youth Opportunities Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="brand">
            <span class="logo">🎯</span>
            <div>
                <h1>Youth Opportunities Hub</h1>
                <p>Гранты, вакансии и мероприятия для молодежи (16–35 лет)</p>
            </div>
        </div>
        <button id="update-btn" class="fetch-btn">⚡ Поиск обновлений</button>
    </header>

    <main class="container">
        <section class="filter-section">
            <div class="search-box">
                <input type="text" id="search-input" class="search-input" placeholder="🔍 Поиск по названию или описанию...">
            </div>
            
            <div class="filter-group">
                <button class="filter-chip active" data-category="all">Все</button>
                <button class="filter-chip" data-category="вакансия">💼 Вакансии</button>
                <button class="filter-chip" data-category="грант">🎓 Гранты</button>
                <button class="filter-chip" data-category="мероприятие">🌍 Мероприятия</button>
            </div>
        </section>

        <section id="cards-container" class="cards-grid">
            <p class="loading-text">Загрузка актуальных возможностей...</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
